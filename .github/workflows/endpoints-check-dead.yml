# Weekly refresh of dead-route coverage in PostHog (same strict sync script as inventory sync).
#
# Fails when PostHog secrets are missing, HogQL query fails, ingest fails, or verification
# cannot find endpoint_inventory_sync / endpoint_dead_route for this SHA.
#
# Secrets: POSTHOG_PROJECT_TOKEN (ingest), POSTHOG_QUERY_API_KEY (query:read)
name: PostHog dead endpoints check

permissions:
  contents: read

jobs:
  endpoints-check-dead:
    name: Dead API endpoint inventory check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require PostHog secrets
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_QUERY_API_KEY: ${{ secrets.POSTHOG_QUERY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POSTHOG_PROJECT_TOKEN}" ]; then
            echo "::error::POSTHOG_PROJECT_TOKEN is not set. Add the project ingest key (phc_…) in repo Secrets → Actions."
            exit 1
          fi
          if [ -z "${POSTHOG_QUERY_API_KEY}" ]; then
            echo "::error::POSTHOG_QUERY_API_KEY is not set. Add a personal API key with query:read in repo Secrets → Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --no-cache-dir requests==2.34.2

      - name: Verify endpoint inventory is present
        run: test -s Server/endpoints.json

      - name: Sync dead routes to PostHog and verify ingest
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_QUERY_API_KEY: ${{ secrets.POSTHOG_QUERY_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 Server/scripts/endpoints/sync_inventory_posthog.py
          echo "PostHog dead-route sync completed successfully."
