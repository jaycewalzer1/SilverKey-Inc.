# Reusable does-it-run smoke (stage 1 pre-test gate). Called from test.yml.
name: Does it run (callable)

on:
  workflow_call:
    inputs:
      base_sha:
        description: Git base SHA for deploy-path detection (PR base or push before)
        required: false
        type: string
      head_sha:
        description: Git head SHA for deploy-path detection
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect-docker-scope:
    name: Detect Docker smoke scope
    runs-on: ubuntu-latest
    outputs:
      run_docker: ${{ steps.filter.outputs.run_docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect deploy/docker path changes
        id: filter
        run: |
          set -euo pipefail
          BASE="${{ inputs.base_sha }}"
          HEAD="${{ inputs.head_sha }}"
          if [[ -z "$HEAD" ]]; then
            HEAD="${{ github.sha }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git rev-parse "${HEAD}^" 2>/dev/null || echo "")"
          fi
          if [[ -z "$BASE" ]]; then
            echo "run_docker=true"
            echo "run_docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if bash scripts/ci/does-it-run-path-filter.sh "$BASE" "$HEAD"; then
            echo "run_docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_docker=false" >> "$GITHUB_OUTPUT"
          fi

  does-it-run-frontend:
    name: Frontend smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: Client/pnpm-lock.yaml

      - name: Run frontend smoke
        run: bash scripts/ci/does-it-run.sh --mode frontend

  does-it-run-backend-light:
    name: Backend light smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: Client/pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Server/requirements/runtime.txt

      - name: Run backend-light smoke
        run: bash scripts/ci/does-it-run.sh --mode backend-light

      - name: Upload backend-light logs on failure
        if: failure()
        run: |
          docker compose -f scripts/ci/does-it-run-services-compose.yml -p silverkey-does-it-run-services logs --tail 80 || true

  does-it-run-docker:
    name: Backend Docker smoke
    runs-on: ubuntu-latest
    needs: detect-docker-scope
    if: needs.detect-docker-scope.outputs.run_docker == 'true'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run Docker smoke
        run: bash scripts/ci/does-it-run.sh --mode docker

      - name: Upload Docker compose logs on failure
        if: failure()
        run: |
          docker compose -p silverkey-does-it-run-docker logs --tail 80 || true

  does-it-run-gate:
    name: Does it run (gate)
    runs-on: ubuntu-latest
    needs:
      - detect-docker-scope
      - does-it-run-frontend
      - does-it-run-backend-light
      - does-it-run-docker
    if: always()
    steps:
      - name: Aggregate smoke results
        run: |
          set -euo pipefail
          fail=0
          if [[ "${{ needs.does-it-run-frontend.result }}" != "success" ]]; then
            echo "does-it-run-gate: frontend smoke failed (${{ needs.does-it-run-frontend.result }})" >&2
            fail=1
          fi
          if [[ "${{ needs.does-it-run-backend-light.result }}" != "success" ]]; then
            echo "does-it-run-gate: backend-light smoke failed (${{ needs.does-it-run-backend-light.result }})" >&2
            fail=1
          fi
          if [[ "${{ needs.detect-docker-scope.outputs.run_docker }}" == "true" ]]; then
            if [[ "${{ needs.does-it-run-docker.result }}" != "success" ]]; then
              echo "does-it-run-gate: docker smoke failed (${{ needs.does-it-run-docker.result }})" >&2
              fail=1
            fi
          elif [[ "${{ needs.does-it-run-docker.result }}" == "failure" ]]; then
            echo "does-it-run-gate: docker smoke failed unexpectedly" >&2
            fail=1
          fi
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          echo "does-it-run-gate: all required smoke checks passed"
