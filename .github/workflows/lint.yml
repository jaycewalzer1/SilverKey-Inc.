# Single lint workflow: runs root script for client and server.
# scripts/ci/run-all-linters.sh applies auto-fixes first (Client: pnpm run fix; Server: ruff --fix/format), then linters.
# Linters: Server lint_*.py + lint_*.sh; Client lint.d/*.sh + pnpm check.
# Scheduled weekly (same cadence as dependabot.yml weekly-all). Run locally before merge: make lint / pnpm check.
# Tests are run separately via test.yml workflow.
name: Lint

permissions:
  contents: read

jobs:
  client-lint:
    name: Client (all linters)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: Client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: Client
        run: pnpm install --frozen-lockfile

      - name: Run all client linters (root script)
        run: ./scripts/ci/run-all-linters.sh client

  server-lint:
    name: Server (all linters)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Hosted runners have limited disk; full requirements/runtime.txt still pulls torch + ML wheels (~multi-GB).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Server/requirements/lint.txt

      # lint.txt = ci.txt (import surface) + ruff + pyright. No torch/test.txt (pytest-only).
      - name: Install Server lint dependencies
        run: |
          python -m pip install --upgrade pip
          cd Server
          python -m venv .venv
          .venv/bin/pip install --no-cache-dir -r requirements/lint.txt

      # Prepend venv on the shell PATH (not env.PATH — that expression is often empty and
      # would hide /usr/bin, breaking #!/usr/bin/env bash for run-all-linters.sh).
      - name: Run all server linters (root script)
        run: |
          export PATH="${{ github.workspace }}/Server/.venv/bin:$PATH"
          ./scripts/ci/run-all-linters.sh server
